[project]
name = "companion-edge"
version = "0.5.0"
description = "Companion edge device: camera, microphone and speaker on a small Linux board"
license = "MPL-2.0"
# Small boards (RISC-V, ARM) often ship an older Python; uv can install 3.13 where available.
requires-python = ">=3.11"
# Deliberately tiny: audio and video go through ALSA tools, ffmpeg and libopus,
# so no numpy/Pillow/OpenCV has to be compiled on the board.
dependencies = [
    "websockets>=10",  # the legacy (10-13) and new client APIs both work
]

[project.scripts]
companion-edge = "companion_edge.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["companion_edge"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
