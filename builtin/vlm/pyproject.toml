# The built-in vision model: Mage-VL behind the OpenAI chat API, installed and
# run by the Companion Server in a virtual environment of its own
# (builtin/vlm/.venv). Not a package: `uv sync --project builtin/vlm --extra cuda|cpu`.

[project]
name = "companion-builtin-vlm"
version = "1.0.0"
description = "Mage-VL for the Companion Server's built-in vision"
requires-python = ">=3.11,<3.12"
dependencies = [
    "transformers>=5.7,<5.21",
    "accelerate>=1.10",
    "huggingface-hub>=1.0",
    "safetensors>=0.6",
    "pillow>=11",
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    # Model downloads trust the OS certificate store (proxies, antivirus HTTPS scanning).
    "truststore>=0.10",
]

[project.optional-dependencies]
# CUDA 13 builds of PyTorch (Turing and newer GPUs); Mage-VL's FP8 layers need
# comfy-kitchen, its fused decode kernels ninja (and the CUDA toolkit).
cuda = [
    "torch>=2.14.1,<2.15",
    "torchvision>=0.29.1,<0.30",
    "comfy-kitchen==0.2.22",
    "ninja>=1.13",
]
cpu = [
    "torch>=2.14.1,<2.15",
    "torchvision>=0.29.1,<0.30",
]

[tool.uv]
package = false
conflicts = [[{ extra = "cuda" }, { extra = "cpu" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", extra = "cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu130", extra = "cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
