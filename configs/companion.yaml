# Companion Server configuration (non-secret).
# Machine-specific overrides go in configs/companion.local.yaml (git-ignored),
# which is deep-merged on top of this file. Secrets go in .env.

server:
  host: 127.0.0.1
  port: 8765
  dev_client: true          # serve the browser test client at /dev/
  # Clients must present this token (from .env) when it is set; it is required
  # when host is not loopback, e.g. 0.0.0.0 or a Tailscale address for edge devices.
  auth_token_env: COMPANION_TOKEN
  session_linger_s: 60      # keep a session this long so a dropped device can resume
  dashboard: true           # serve the admin dashboard at /admin/
  # Admin token (from .env) for the dashboard and /v1/admin/*. While it is unset,
  # they only answer this machine; the device token above never grants access.
  admin_token_env: COMPANION_ADMIN_TOKEN
  dashboard_conversation: false  # show transcripts and replies on the dashboard
  # A read-only page at /view/ for phones on this machine's Tailscale network:
  # the conversation and what the devices' cameras see. See docs/remote-access.md.
  viewer:
    enabled: false
    cameras: true
  # For boards outside this network (router port forward or IPv6): a second
  # listener with TLS that serves only devices with their own tokens, never the
  # dashboard. See docs/remote-access.md.
  public:
    enabled: false
    hosts: ["0.0.0.0", "::"]
    port: 8766
    url: null               # e.g. wss://home.example.net:8766/v1/realtime

logging:
  level: INFO               # DEBUG | INFO | WARNING | ERROR
  format: text              # text | json

storage:
  data_dir: data            # relative to the project root

personas_dir: personas

# Agent backends. hermes/openclaw keep transcripts and long-term memory on the
# agent's host; base_url may point at another machine (LAN or Tailscale).
# direct = no agent framework: the companion talks to an LLM itself.
agent:
  provider: hermes          # hermes | openclaw | direct
  persona: default
  history_turns: 20
  hermes:
    base_url: http://127.0.0.1:8642/v1
    api_key_env: HERMES_API_KEY
    model: hermes-agent
    memory_scope: companion # X-Hermes-Session-Key: long-term memory scope
    timeout: 300
  openclaw:
    # Needs gateway.http.endpoints.chatCompletions.enabled: true in openclaw.json
    base_url: http://127.0.0.1:18789/v1
    api_key_env: OPENCLAW_GATEWAY_TOKEN   # gateway.auth.token (or password)
    model: openclaw
    agent_id: main
    timeout: 300
    extra_body: {}          # e.g. {max_tokens: 200}; see docs/performance.md

# Used by agent.provider: direct (Hermes manages its own model).
llm:
  provider: openai_compatible
  base_url: http://127.0.0.1:11434/v1
  api_key_env: LLM_API_KEY
  model: default
  extra_body: {}            # e.g. {chat_template_kwargs: {enable_thinking: false}}

# Whisper on this machine is builtin.stt below; this is a server of your own or
# a service: POST {base_url}/audio/transcriptions (speaches, whisper.cpp server,
# OpenAI, Groq).
stt:
  provider: openai_compatible   # openai_compatible | none
  base_url: http://127.0.0.1:8000/v1
  api_key_env: STT_API_KEY
  model: large-v3-turbo     # the server's model name
  language: ja              # null = auto-detect; yue = Cantonese
  preload: true             # one tiny request at startup loads the server's model
  # Keep each utterance as heard (data/recordings, WAV + transcript) to check
  # recognition from the dashboard; deleted after keep_audio_days.
  keep_audio: false
  keep_audio_days: 3
  # Text that steers recognition toward a writing style (Whisper's initial
  # prompt), e.g. Cantonese in traditional characters. None by default; see docs/speech.md.
  prompt: null

vad:
  provider: silero          # silero | energy
  threshold: 0.5
  min_speech_ms: 250
  min_silence_ms: 1000      # pause that ends an utterance; lower = faster, but splits sentences
  speech_pad_ms: 200
  max_utterance_s: 30

tts:
  provider: openai_compatible   # openai_compatible | none
  base_url: http://127.0.0.1:8088/v1   # Irodori-TTS-Server default
  api_key_env: TTS_API_KEY
  model: irodori-tts
  # Irodori: "none" = no reference audio. For a stable character voice, put a
  # reference clip in Irodori-TTS-Server's voices/ dir and use its id here.
  voice: none
  response_format: wav
  extra_body:               # vendor-specific fields merged into the request
    irodori:
      seed: 1234            # fixed seed keeps the no-reference voice consistent

# Built-in speech: engines the server installs (builtin/stt, builtin/tts) and
# runs itself, for a setup without STT/TTS servers. On, an engine replaces
# stt.provider or tts.provider (their language, prompt, voice and extra_body
# still apply); off, its process ends and its GPU memory is free at once. Speech
# in the dashboard installs them, turns them on and off and switches models.
# Models live in builtin/<engine>/models/<name>; one named here that is not
# there yet is downloaded there first. Voices go in builtin/tts/voices.
builtin:
  libraries: auto           # auto | cuda | cpu (auto: cuda when an NVIDIA GPU is found)
  start_timeout_s: 900      # a first start downloads the model
  stt:
    enabled: false
    model: large-v3-turbo   # a folder in builtin/stt/models, a Whisper size or owner/name
    device: auto            # auto | cuda | cpu
    compute_type: auto
    beam_size: 1
  tts:
    enabled: false
    checkpoint: Aratako/Irodori-TTS-v4.1-Small-MF   # a folder in builtin/tts/models or owner/name; MF = 4 steps
    device: auto
    precision: fp32         # fp32 | bf16 (bf16 halves the memory, needs CUDA)
  # Built-in vision model (Mage-VL), used instead of vlm.provider while on. auto:
  # FP8 on RTX 40 and newer (~6.4 GB), BF16/FP16 on older cards. See docs/vision.md.
  vlm:
    enabled: false
    model: auto             # or a folder in builtin/vlm/models, or owner/name
    device: auto
    precision: auto         # auto | bf16 | fp16 (FP8 models always run in FP8)
    fused: true             # FP8: build fast decode kernels (CUDA toolkit + VS C++ tools)

# Vision-language model for vision.mode: vlm. Any OpenAI-compatible chat
# endpoint that accepts image_url parts: llama.cpp with --mmproj, vLLM,
# LM Studio, Ollama, or a cloud API.
vlm:
  provider: none            # openai_compatible | none
  base_url: http://127.0.0.1:8080/v1
  api_key_env: VLM_API_KEY
  model: default
  max_image_side: 768       # frames are downscaled before sending
  max_tokens: 300
  timeout: 60
  extra_body: {}

# Camera frames from clients. Each session must opt in (vision.enable).
vision:
  enabled: true             # server-wide switch
  mode: agent               # agent: attach the newest frames as images to your next
                            # message (the agent's model must accept images)
                            # vlm: describe frames with the vlm provider above
  max_turn_images: 1        # agent mode: frames attached to one turn, oldest first
  max_frame_bytes: 4194304
  min_interval_s: 2.0       # rate limit per session (manual frames excepted)
  dedup: true               # skip frames that look like the last analyzed one
  dedup_threshold: 6        # difference-hash bits; higher = more frames skipped
  observation_max_age_s: 300
  max_context_observations: 3
  inject: user              # user: prepend new observations to the user's turn
                            # (keeps agent prompt caches warm); system: system prompt
  capture_on_turn: true     # ask camera devices for a fresh frame when you speak/type
  wait_for_pending_s: 3.0   # a turn waits this long for that frame (or its analysis)
  store_images: false       # images are never written to disk unless true
  retention_days: 7         # stored observations (direct backend) and images

# When the companion may speak on its own (v0.3). Camera changes and client
# events are scored by fixed rules; the agent is only asked when every guard
# passes, and it may still choose to stay silent.
attention:
  proactive: true           # master switch; conversation works either way
  min_interval_s: 900       # at least 15 minutes between proactive remarks
  max_per_hour: 4
  quiet_hours:              # no proactive speech in this window
    enabled: true
    start: "23:00"
    end: "08:00"
    timezone: null          # null = this host's time zone; or e.g. "Asia/Tokyo"
  grace_after_activity_s: 120   # stay quiet this long after anyone spoke
  scene_change_threshold: 20    # frame-hash bits that count as a scene change
  absence_s: 1200               # a change after this long counts as "activity resumed"
  idle: false                   # idle check-ins: speak up after a quiet spell of
  idle_min_s: 1800              #   a random length between these two
  idle_max_s: 3600
  event_dedup_s: 120
  remember_threshold: 0.2
  context_threshold: 0.4
  speak_threshold: 0.6
  debug: false              # send each decision and its reasons to clients
  decisions: false          # ask for JSON: reply / silent / remember (instead of [SILENT])
  triage:                   # a small, fast model asked first (needs decisions)
    enabled: false
    base_url: http://127.0.0.1:11434/v1
    api_key_env: TRIAGE_API_KEY
    model: default
    timeout: 30
    max_tokens: 200
    extra_body: {}

# Full-duplex conversation (v0.5). Clients that keep the microphone open while
# the companion speaks (full_duplex in audio.input.start) can cut in.
realtime:
  barge_in: true                # user speech stops the reply and its playback
  barge_in_min_speech_ms: 600   # while audio plays on a device without echo
  barge_in_threshold: 0.8       #   cancellation, cutting in needs clearer speech
  transcribe_timeout_s: 60      # watchdog: longer than this means something got lost
  interrupt_timeout_s: 3        # wait this long for a device to confirm it stopped
  playback_slack_s: 8           # SPEAKING ends this long after the audio should have played
  ping_interval_s: 10           # round-trip and clock-offset probes (0 = off)
  echo:
    canceller: none             # none, or nlms (reference server-side echo canceller)
    filter_ms: 64
    max_delay_ms: 600           # speaker + room latency the canceller searches
    guard: true                 # drop transcripts that repeat what the companion just said
    guard_similarity: 0.6
    guard_window_s: 20

# Latency per pipeline stage, at GET /v1/metrics. Numbers only: no audio,
# images or text are recorded.
metrics:
  enabled: true
  window: 200                   # samples kept per stage for percentiles
  emit_turn: false              # also send per-turn timings to clients (metrics.turn)

# People the companion knows (the dashboard's People page adds them). Face and
# voice samples stay in data/people; the agent only gets names. See docs/people.md.
people:
  face_threshold: 0.45      # how alike a face must be to someone's samples
  face_margin: 0.10         # and this far ahead of the next person
  voice_threshold: 0.3      # voices are less alike than faces
  voice_margin: 0.05
  max_face_samples: 40
  stranger_retention_h: 24  # unknown faces are forgotten after this

# Who is around: faces on every camera, tracked and named, by the built-in
# perception engine (builtin/perception). The voice model is gated: HF_TOKEN in
# .env, or download it into builtin/perception/models. See docs/people.md.
perception:
  enabled: false
  speakers: false           # who said each sentence (voice, faces, lips), told to the agent
  device: auto              # auto | cuda | cpu
  face_model: buffalo_l
  voice_model: speaker-diarization-community-1   # or none
  min_face_px: 40
  left_after_s: 60          # out of view this long = gone
  picture_check: true       # ask the vlm whether an unknown face is a poster or screen
  static_picture_s: 180     # without a vlm: a face that never moves is a picture
  enrol_seconds: 10
  glance: false             # the vlm glances at the cameras: who is doing what
  glance_s: null            # null: 1 s with builtin.vlm, 10 s with another vision model
  glance_tokens: 120

# Answer only what is meant for the companion (needs perception.speakers):
# talk between people becomes "overheard" context, strangers' words context,
# the TV is only logged. See docs/people.md.
routing:
  enabled: false
  wake_names: []            # empty: the persona's display name and file name
  followup_s: 20            # after the companion spoke, anyone known may answer it
  alone_means_addressed: true
  answer_acquaintances: true
  answer_strangers: false
  facing_cameras: []        # cameras next to the speaker: a face turned to it = addressed
  debug: false              # send routing.decision to clients

# What each person has been doing (from glances, or present/away without them),
# and rules that turn long activities into events. See docs/people.md.
timeline:
  enabled: false
  sample_s: 60              # presence samples
  min_switch_s: 120         # a different activity must last this long to end an episode
  retention_days: 7
  rules:
    - {id: gaming-2h, activity: gaming, min_minutes: 120}
    - {id: computer-90min, activity: desk_computer, min_minutes: 90}
    - {id: phone-in-bed-late, activity: phone, posture: lying_down, after: "00:30", before: "05:00"}
    - {id: back-after-4h, activity: away, min_minutes: 240, when: after, person: user}

# IP cameras and phones the server watches itself (or use the dashboard's
# Cameras page). Logins come from .env, never from the URL.
cameras: []
#  - id: livingroom
#    url: http://192.168.1.20:8080/shot.jpg   # snapshot, MJPEG (/video) or rtsp://
#    username_env: CAMERA_USERNAME
#    password_env: CAMERA_PASSWORD
#    mode: change                             # change | periodic (with interval_s)
#    perception_fps: 10                       # with perception on: pictures a second for faces
