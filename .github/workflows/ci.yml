name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Import check
        run: uv run python -m companion --version

  dashboard:
    name: dashboard build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/dashboard/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Committed build matches the source
        run: |
          git add --intent-to-add --all dist
          git diff --exit-code --stat -- dist
